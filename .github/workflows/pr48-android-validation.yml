name: PR48 Android HTML runtime
on:
  push:
    branches: [validation/pr48-android-lifetime]
permissions:
  contents: read
  actions: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Reuse the exact candidate APK
        uses: actions/download-artifact@v4
        with:
          name: android-html-runtime
          run-id: 42640698207
          github-token: ${{ github.token }}
          path: .candidate-apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Python WebSocket support
        run: python -c "import websocket" || python -m pip install websocket-client
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -memory 2048 -cores 2 -camera-back none -camera-front none
          disable-animations: true
          script: python tools/pr48_android_html_check.py
      - name: Retain runner diagnostics
        if: always()
        run: |
          mkdir -p AndroidHtmlResults
          free -h > AndroidHtmlResults/runner-memory.txt
          sudo dmesg | tail -100 > AndroidHtmlResults/runner-kernel.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-html-runtime
          path: |
            AndroidHtmlResults/
          if-no-files-found: warn
          retention-days: 7
